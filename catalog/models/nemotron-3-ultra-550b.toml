# nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 — NemotronH hybrid: Mamba2 + attention +
# latent-MoE FFN layers. From HF config.json (model_type nemotron_h):
#   108 layers total: 48 mamba (M) + 12 attention (*) + 48 MoE-FFN (E);
#   hidden 8192; attention 64 heads x 128, 2 KV heads; mamba: 256 heads x 64
#   (d_inner 16384), ssm_state 128, 8 groups, conv 4, fp32 ssm cache;
#   MoE (latent): experts act on moe_latent_size 2048 with inter 5120,
#   relu^2 (non-gated, 2 matrices/expert), 512 routed + 1 shared (inter
#   10240), 22 per token; vocab 131072; 1 MTP layer (not modeled);
#   NVFP4 expert weights, bf16 elsewhere; max_pos 262144.
#
# Param split (computed; shared expert kept in the fp4 expert bucket —
# NVFP4 checkpoints quantize it too):
#   per routed expert (2 matrices, latent 2048 x inter 5120) = 20_971_520
#   shared expert total = 48*2*2048*10240 = 2_013_265_920
#   active expert  = 22*per*48 + shared = 24_159_191_040
#   resident expert= 512*per*48 + shared = 517_409_341_440
#   mamba layer (in_proj 8192x35072 + out 16384x8192) = 421_527_552
#   attn layer = 138_412_032; latent up/down proj = 1_610_612_736
#   router = 201_326_592; lm_head = 1_073_741_824
#   active non-exp = 24_779_948_032; resident non-exp = 25_853_689_856
#   Sanity: fp4+bf16 residency ~= 310_412_050_432 B vs
#   checkpoint 352_284_061_280 B (gap = NVFP4 scales + MTP).
#
# Modelled directly: 12 attention layers (64 x 128, 2 KV heads) and 48 Mamba2 layers as linear state (fp32 ssm 16384x128 + conv 73728, 8_683_520 B/layer/seq); the 48 FFN-only layers have no token mixing and appear only in the weight streams.

name = "NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
