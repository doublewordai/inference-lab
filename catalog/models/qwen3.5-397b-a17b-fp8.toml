# Qwen/Qwen3.5-397B-A17B-FP8 — hybrid MoE (GatedDeltaNet linear + GQA full attention),
# same family as the Qwen3.6-35B template (catalog/models/qwen3.6-35b-a3b.toml).
# From HF Qwen/Qwen3.5-397B-A17B-FP8 config.json (text_config):
#   60 layers, full_attention_interval 4 -> 15 full-attn + 45 GatedDeltaNet
#   linear; hidden 4096; full attn: 32 q / 2 kv heads, head_dim 256; linear:
#   16 key / 64 value heads, key/value head_dim 128, conv kernel 4; MoE every
#   layer: 512 routed + 1 shared expert, 10 per token, moe_intermediate
#   1024 (shared_expert_intermediate 1024); vocab 248320; 1 MTP layer
#   (not modeled); FP8 quantization; max_pos 262144.
#
# Param split (computed, template arithmetic):
#   per expert = 3*4096*1024 = 12_582_912
#   active expert  = (10 routed + 1 shared) * per * 60 = 8_304_721_920
#   resident expert= (512 + 1 shared)      * per * 60 = 387_302_031_360
#   full-attn layer (q+o 32x256, k+v 2x256) = 4096*17408 = 71_303_168
#   linear layer (qkvz + out; 2*Hk*dk + 3*Hv*dv) = 4096*28672 = 117_440_512
#   router = 125_829_120; lm_head = 248320*4096 = 1_017_118_720
#   active non-exp = 15*attn + 45*linear + router + lm_head = 7_497_318_400
#   resident non-exp (+embedding) = 8_514_437_120
#   Sanity: fp8 residency ~= 395_816_468_480 B vs checkpoint 406_125_181_280 B.

