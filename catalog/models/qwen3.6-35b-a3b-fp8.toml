# Source: configs/estate/qwen3.6-35b-a3b-fp8-b200.toml
# Qwen3.6-35B-A3B-FP8 on one B200 (tp=1) — estate serving config.
#
# Model arithmetic is identical to configs/qwen3.6-35b-a3b-gh200.toml (HF
# Qwen/Qwen3.6-35B-A3B config.json: 40 layers = 10 GQA full-attn + 30
# GatedDeltaNet linear, 256-expert MoE with 8 routed + 1 shared, hidden 2048;
# param split computed there). Differences here: the production deployment is
# the FP8 quantization (expert + non-expert weights fp8, KV bf16), the
# hardware is B200, and the scheduler runs deadline-priority admission the way
# the estate dispatches (production injects deadline priorities into the
# engines via inject_deadline_priority).
#
# B200 hardware (dense, not sparse, per-GPU; first-principles datasheet
# numbers, deviations from achieved rates are findings):
#   FP4  9.0e15 FLOP/s dense      FP8  4.5e15      BF16  2.25e15
#   HBM3e 7.7e12 B/s, 180 GB capacity.

name = "Qwen3.6-35B-A3B-FP8"
hidden_dim = 2048
max_seq_len = 262144
attention_precision = "bf16"

[[weights]]
precision = "fp8"
active_params = 1132462080
resident_params = 32338083840
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 40 }

[[weights]]
precision = "fp8"
active_params = 1725693952
resident_params = 2234253312

[[layers]]
kind = "attention"
count = 10
heads = 16
head_dim = 256
kv_heads = 2
kv_precision = "bf16"

[[layers]]
kind = "linear"
count = 30
state_bytes = 1114112
