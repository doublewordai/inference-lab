# Source: configs/estate/gpt-oss-120b-b200.toml
# openai/gpt-oss-120b — MoE with alternating sliding(128)/full attention.
# From HF openai/gpt-oss-120b config.json:
#   36 layers (18 sliding_attention + 18 full_attention, strictly
#   alternating), hidden 2880, 64 heads x head_dim 64, 8 KV heads,
#   sliding_window 128; MoE every layer: 128 experts, 4 per token, gated
#   inter 2880 (native MXFP4 expert weights); vocab 201088; max_pos 131072
#   (YaRN x32). Attention/embeddings bf16.
#
# Param split (computed):
#   per expert (gated, inter 2880) = 3*2880*2880 = 24_883_200
#   active expert  = 4 * per * 36   = 3_583_180_800
#   resident expert= 128 * per * 36 = 114_661_785_600
#   attn/layer (q 64x64 + kv 8x64 + o) = 2880*9216 = 26_542_080; x36 = 955_514_880
#   router = 13_271_040; lm_head = 201088*2880 = 579_133_440
#   active non-exp = 1_547_919_360; resident non-exp (+embed) = 2_127_052_800
#   Sanity: fp4+bf16 residency ~= 61_584_998_400 B vs checkpoint 65_248_815_744.
#
# Modelled directly: 18 sliding(128) and 18 full attention classes (64 x 64, 8 KV heads); fp4 expert stream with coupon-collector routing, bf16 non-expert stream.

name = "gpt-oss-120b"
hidden_dim = 2880
max_seq_len = 131072
attention_precision = "bf16"

[[weights]]
precision = "fp4"
active_params = 3583180800
resident_params = 114661785600
routing = { routed_experts = 128, experts_per_tok = 4, moe_layers = 36 }

[[weights]]
precision = "bf16"
active_params = 1547919360
resident_params = 2127052800

[[layers]]
kind = "attention"
count = 18
heads = 64
head_dim = 64
kv_heads = 8
window = 128
kv_precision = "bf16"

[[layers]]
kind = "attention"
count = 18
heads = 64
head_dim = 64
kv_heads = 8
kv_precision = "bf16"
