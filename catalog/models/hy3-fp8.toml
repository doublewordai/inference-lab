# Source: configs/estate/hy3-fp8-b200.toml
# tencent/Hy3-FP8 — plain GQA MoE (model_type hy_v3). From HF
# tencent/Hy3-FP8 config.json:
#   80 layers, hidden 4096, 64 heads x head_dim 128, 8 KV heads, full
#   attention; first layer dense (inter 13312), 79 MoE layers: 192 routed +
#   1 shared expert, 8 per token, moe/expert inter 1536; vocab 120832;
#   1 MTP layer (not modeled); FP8; max_pos 262144.
# `qwen35` with num_attention_layers = num_layers (degenerates to plain
# GQA + coupon-collector MoE; knee at E/k = 24).
#
# Param split (computed; shared expert in the fp8 expert bucket):
#   per expert = 3*4096*1536 = 18_874_368
#   active expert  = (8+1 shared) * per * 79 = 13_419_675_648
#   resident expert= (192+1)      * per * 79 = 287_777_488_896
#   attn/layer (q+o 64x128, k+v 8x128) = 4096*18432 = 75_497_472; x80 = 6_039_797_760
#   dense FFN = 163_577_856; router = 62_128_128; lm_head = 494_927_872
#   active non-exp = 6_760_431_616; resident non-exp (+embed) = 7_255_359_488
#   Sanity: fp8 residency = 295_032_848_384 B vs checkpoint
#   299_889_838_946 B (safetensors sum).

name = "Hy3-FP8"
hidden_dim = 4096
max_seq_len = 262144
attention_precision = "bf16"

[[weights]]
precision = "fp8"
active_params = 13419675648
resident_params = 287777488896
routing = { routed_experts = 192, experts_per_tok = 8, moe_layers = 79 }

[[weights]]
precision = "fp8"
active_params = 6760431616
resident_params = 7255359488

[[layers]]
kind = "attention"
count = 80
heads = 64
head_dim = 128
kv_heads = 8
kv_precision = "bf16"
