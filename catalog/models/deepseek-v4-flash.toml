# deepseek-ai/DeepSeek-V4-Flash — MLA MoE with hybrid sparse attention.
# From HF deepseek-ai/DeepSeek-V4-Flash config.json: 43 layers, hidden 4096, 64 heads,
# MLA latent 512 + qk_rope 64; compress_ratios -> 2 dense + 21 near(4) +
# 20 far(128) (+1 trailing 0 = the MTP head, not in the backbone); sliding
# window 128 in every layer; indexer 64 heads x 128, top-k 512; MoE 256 routed
# + 1 shared, 6 per token, moe_intermediate 2048. expert_dtype fp4 (native),
# attention/dense fp8, KV cache fp8 (deployed inference stack).
# Param split:
#   per expert = 3*4096*2048 = 25_165_824
#   active expert  = (6 routed + 1 shared) * per * 43 = 7_574_913_024
#   resident expert= (256 + 1 shared)      * per * 43 = 278_107_521_024
#   active non-exp (MLA q/kv/o low-rank projections, indexer, dense FFN,
#   lm_head) = 5_660_947_776; resident non-exp = 6_225_000_000.

name = "DeepSeek-V4-Flash"
hidden_dim = 4096
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
active_params = 7574913024
resident_params = 278107521024
routing = { routed_experts = 256, experts_per_tok = 6, moe_layers = 43 }

[[weights]]
precision = "fp8"
active_params = 5660947776
resident_params = 6225000000

[[layers]]
kind = "mla"
count = 2
latent_dim = 512
q_latent_dim = 1024
o_latent_dim = 1024
heads = 64
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128

[[layers]]
kind = "mla"
count = 21
latent_dim = 512
q_latent_dim = 1024
o_latent_dim = 1024
heads = 64
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128
history = { compress_ratio = 4, index_topk = 512, indexer = { heads = 64, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }

[[layers]]
kind = "mla"
count = 20
latent_dim = 512
q_latent_dim = 1024
o_latent_dim = 1024
heads = 64
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128
