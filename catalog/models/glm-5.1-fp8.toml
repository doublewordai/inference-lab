# zai-org/GLM-5.1-FP8 — MLA + DeepSeek-style sparse attention (DSA) + MoE.
# From HF zai-org/GLM-5.1-FP8 config.json (model_type glm_moe_dsa):
#   78 layers, hidden 6144, 64 heads; MLA kv_lora_rank 512 + qk_rope 64
#   (qk_nope 192, v_head 256); DSA indexer: 32 heads x 128, index_topk 2048;
#   every layer runs its own indexer (no indexer_types field -> all 78 full);
#   MoE: first 3 layers dense (inter 12288), 75 MoE layers with 256 routed +
#   1 shared expert, 8 per token, moe_intermediate 2048; vocab 154880; 1 MTP
#   layer (not modeled). NOTE: the archive/task label "GQA MoE" does not match
#   the HF config — this is an MLA+DSA model, hence the deepseek_v4 variant.
#
# Param split (computed, FP8 weights incl. shared expert; KV bf16):
#   per expert = 3*6144*2048 = 37_748_736
#   active expert  = (8+1 shared) * per * 75 = 25_480_396_800
#   resident expert= (256+1)      * per * 75 = 727_606_886_400
#   per-layer MLA (q_a 6144x2048 + q_b 2048x16384 + kv_a 6144x576 +
#     kv_b 512x28672 + o 16384x6144) = 165_019_648
#   per-full-indexer params (q 6144x4096 + k 6144x128) = 25_952_256
#   dense FFN (3 layers x 3*6144*12288) = 679_477_248
#   router (75*6144*256) = 117_964_800;  lm_head (154880*6144) = 951_582_720
#   active non-exp = 16_644_833_280;  resident non-exp (+embedding) = 17_596_416_000
#   Sanity: resident total at fp8 ~= 745_203_302_400 B vs checkpoint
#   756_162_687_872 B (gap = MTP layer + quantization scales).
#
# Modelled directly: 78 DSA MLA layers, top-2048 selection over the uncompressed history with a 32 x 128 indexer per layer; attention priced with the true head shape 64 x (256+256).

name = "GLM-5.1-FP8"
hidden_dim = 6144
max_seq_len = 202752
attention_precision = "bf16"

[[weights]]
precision = "fp8"
active_params = 25480396800
resident_params = 727606886400
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 75 }

[[weights]]
precision = "fp8"
active_params = 16644833280
resident_params = 17596416000

[[layers]]
kind = "mla"
count = 78
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "bf16"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "bf16" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256
