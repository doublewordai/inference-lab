# nvidia/GLM-5.3-Flash-NVFP4 — GLM-5.3-Flash (KDA + DSA MLA hybrid MoE) with NVFP4 experts and dense MLP, BF16 rest.
# Architecture as catalog/models/glm-5.3-flash.toml (HF
# nvidia/GLM-5.3-Flash-NVFP4 config.json text_config is the base's: 45
# layers, hidden 4096, 34 KDA + 11 DSA MLA layers, 288 routed + 1 shared
# experts, 8 per token; quantization modelopt NVFP4, group 16). Not
# modelled: the MTP layer (layer 45, BF16 experts), the vision tower, the
# mHC residual mixing beyond its weights.
#
# Param split, exact from the checkpoint's safetensors headers (layers 0-44;
# norms, biases, A_log/dt_bias, hc base/scale, kpool ape and quantization
# scales omitted; packed U8 = 2 params per byte; the F32 KDA conv1d weights
# are folded into bf16). Stored dtypes: routed experts and the dense MLP
# NVFP4; shared experts, attention, indexer, router, lm_head BF16.
#   per expert = 3*4096*2048 = 25_165_824
#   fp4 experts:  active = 8 * per * 42 = 8_455_716_864
#                 resident = 288 * per * 42 = 304_405_807_104
#   fp4 dense MLP (layers 0-2): 3 * 3*4096*12288 = 452_984_832
#   bf16: KDA 137_723_904 * 34 = 4_682_612_736
#     + MLA (q_a 1536x4096 + q_b 16384x1536 + kv_a 512x4096 + kv_b 32768x512
#       + o 4096x16384 = 117_440_512) * 11 = 1_291_845_632
#     + indexer 7_471_104 * 11 = 82_182_144 + mHC 35_389_440
#     + router 288x4096 * 42 = 49_545_216
#     + shared experts 25_165_824 * 42 = 1_056_964_608
#     + lm_head 634_388_480
#     active = 7_832_928_256;  resident (+ embedding 634_388_480) = 8_467_316_736
#   Sanity: resident bytes 169_364_029_440 vs the checkpoint's text layers
#   0-44 at 188_426_671_172 B (gap = NVFP4 block scales, 1 fp8 per 16
#   values, ~19.05 GB, + norms).
#
# KV: on B300 (TP1, --kv-cache-dtype fp8_e4m3, trtllm DSA backends) SGLang
# stores the MLA latent raw at fp8: 512 B per token per DSA layer
# (sglang mem_cache/kv_cache_configurator.py calculate_mla_kv_cache_dim,
# trtllm layout, no scales). Indexer and KDA state as in glm-5.3-flash.toml
# (true indexer shape 32 x 128 over every position: storage matches SGLang's
# per-token allocation, scoring FLOPs and indexer reads over-priced 4x;
# KDA state 64x128x128 fp32 + 3 x 24576 bf16 conv = 4_341_760 B/layer/seq,
# SGLang's KimiLinearStateShape at mamba2_state_dtype defaults; this set's
# --enable-linear-replayssm-spec pins --mamba-ssm-dtype float32, and its
# per-request spec-verify ring scratch is not modelled).

name = "GLM-5.3-Flash-NVFP4"
hidden_dim = 4096
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
scale = { group = 16 }
active_params = 8455716864
resident_params = 304405807104
routing = { routed_experts = 288, experts_per_tok = 8, moe_layers = 42 }

[[weights]]
precision = "fp4"
scale = { group = 16 }
active_params = 452984832
resident_params = 452984832

[[weights]]
precision = "bf16"
active_params = 7832928256
resident_params = 8467316736

[[layers]]
kind = "mla"
count = 11
latent_dim = 512
q_latent_dim = 1536
rope_dim = 0
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256

[[layers]]
kind = "linear"
count = 34
state_bytes = 4341760
