# moonshotai/Kimi-K2.6 — DeepSeek-V3-family MLA MoE (text_config
# architectures DeepseekV3ForCausalLM, model_type kimi_k2). From HF
# moonshotai/Kimi-K2.6 config.json:
#   61 layers, hidden 7168, 64 heads; MLA kv_lora_rank 512 + qk_rope 64
#   (q_lora 1536, qk_nope 128, v_head 128); full attention (no DSA/NSA);
#   first layer dense (inter 18432), 60 MoE layers: 384 routed + 1 shared,
#   8 per token, moe_intermediate 2048; vocab 163840; max_pos 262144.
#   Quantization (compressed-tensors): routed experts int4 g32; attention,
#   shared expert, dense MLP, lm_head stay bf16.
#
# Param split (computed; shared expert bucketed non-expert because it is NOT
# int4-quantized):
#   per expert = 3*7168*2048 = 44_040_192
#   active routed expert  = 8 * per * 60   = 21_139_292_160
#   resident routed expert= 384 * per * 60 = 1_014_686_023_680
#   per-layer MLA (q_a 7168x1536 + q_b 1536x12288 + kv_a 7168x576 +
#     kv_b 512x16384 + o 8192x7168) = 101_122_048; x61 = 6_168_444_928
#   dense FFN = 396_361_728; shared expert x60 = 2_642_411_520
#   router = 165_150_720; lm_head = 1_174_405_120
#   active non-exp = 10_546_774_016
#   resident non-exp (+embed +vision ~0.4e9) = 12_121_179_136
#   Sanity: fp4-priced residency ~= 531_585_370_112 B vs
#   checkpoint ~595e9 (same tensors as K2.5) B (gap = int4 group scales).
#
# Modelled directly: 61 full-context MLA layers (latent 512 + rope 64, bf16), attention priced with the true head shape 64 x (192+128) instead of the 4*hidden approximation.

name = "Kimi-K2.6"
hidden_dim = 7168
max_seq_len = 262144
attention_precision = "bf16"

[[weights]]
precision = "fp4"
active_params = 21139292160
resident_params = 1014686023680
routing = { routed_experts = 384, experts_per_tok = 8, moe_layers = 60 }

[[weights]]
precision = "bf16"
active_params = 10546774016
resident_params = 12121179136

[[layers]]
kind = "mla"
count = 61
latent_dim = 512
q_latent_dim = 1536
rope_dim = 64
kv_precision = "bf16"
window = 0
heads = 64
qk_head_dim = 192
v_head_dim = 128
