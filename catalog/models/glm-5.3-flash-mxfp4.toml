# amd/GLM-5.3-Flash-Quark-MXFP4 — GLM-5.3-Flash (KDA + DSA MLA hybrid MoE) with MXFP4 experts, fp8 KV.
# Architecture as catalog/models/glm-5.3-flash.toml (HF
# amd/GLM-5.3-Flash-Quark-MXFP4 config.json text_config is the base's;
# quantization Quark MXFP4). Per-tensor dtypes from the safetensors headers
# equal zai-org/GLM-5.3-Flash's except the routed and shared experts of
# layers 3-44, which are MXFP4 (packed U8, 2 params per byte, one scale per
# 32 values); the MTP layer's experts stay FP8. So the weight streams are
# glm-5.3-flash.toml's with its expert stream at fp4. The entry exists for
# its KV: on MI355X (TP1, --kv-cache-dtype fp8_e4m3, tilelang
# DSA backends on ROCm, raw MLA layout per sglang mem_cache/
# kv_cache_configurator.py calculate_mla_kv_cache_dim) stores the latent at
# fp8, 512 B per token per DSA layer, where the zai-org FP8 set on H200
# runs bf16 KV.
#
# Param split (exact, layers 0-44; omissions as in glm-5.3-flash.toml):
#   fp4 experts:  active = (8 + 1 shared) * 25_165_824 * 42 = 9_512_681_472
#                 resident = (288 + 1)     * 25_165_824 * 42 = 305_462_771_712
#   fp8 rest (dense MLP 452_984_832 + MLA q_a/q_b/kv_a/o 1_107_296_256)
#     = 1_560_281_088
#   bf16 (KDA, MLA kv_b, indexer, mHC, router, lm_head) active 5_668_667_392,
#     resident (+ embedding) 6_303_055_872
#   Sanity: resident bytes 166_897_778_688 vs the checkpoint's text layers
#   0-44 at 176_445_868_280 B (gap = MXFP4 scales ~9.55 GB + norms).
# Indexer and KDA state as in glm-5.3-flash.toml (true indexer shape 32 x
# 128 over every position, scoring and indexer reads over-priced 4x; KDA
# state 4_341_760 B/layer/seq, fp32 temporal at SGLang's default).

name = "GLM-5.3-Flash-Quark-MXFP4"
hidden_dim = 4096
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
scale = { group = 32 }
active_params = 9512681472
resident_params = 305462771712
routing = { routed_experts = 288, experts_per_tok = 8, moe_layers = 42 }

[[weights]]
precision = "fp8"
active_params = 1560281088
resident_params = 1560281088

[[weights]]
precision = "bf16"
active_params = 5668667392
resident_params = 6303055872

[[layers]]
kind = "mla"
count = 11
latent_dim = 512
q_latent_dim = 1536
rope_dim = 0
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256

[[layers]]
kind = "linear"
count = 34
state_bytes = 4341760
