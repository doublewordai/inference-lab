# deepseek-ai/DeepSeek-V4-Pro-0813 — DeepSeek-V4-Pro backbone (MLA MoE, hybrid compressed sparse attention) plus a DSpark drafter.
# Architecture: HF deepseek-ai/DeepSeek-V4-Pro-0813 config.json matches
# deepseek-ai/DeepSeek-V4-Pro's except for the DSpark fields
# (dspark_block_size 5, dspark_markov_rank 512, dspark_target_layer_ids
# [58, 59, 60]) and two more trailing 0 entries in compress_ratios (three
# draft modules mtp.0-2 instead of one MTP layer). So the layer classes are
# deepseek-v4-pro.toml's: 61 layers, hidden 7168, 128 heads, MLA latent 512
# + rope 64, q_lora 1536, o_lora 1024; compress_ratios -> 30 near (4, with
# a 64 x 128 indexer, top-1024) + 31 far (128); window 128. The draft
# modules (76.1B fp4 + 1.3B fp8 + 0.1B bf16 params resident) are not
# modelled; price them with [speculative].drafter. KV fp8: SGLang defaults
# DeepseekV4ForCausalLM to fp8_e4m3 (srt/arg_groups/overrides.py,
# _deepseek_v4_kv_cache_dtype), with no override set.
#
# Param split, exact from the safetensors headers (layers 0-60; norms,
# biases, attention sinks, compressor position embeddings (ape), the hash
# layers' tid2eid tables and quantization scales omitted; packed I8 = 2 fp4
# params per byte):
#   per expert = 3*7168*3072 = 66_060_288
#   fp4 routed: active   6 * per * 61 = 24_178_065_408
#               resident 384 * per * 61 = 1_547_396_186_112
#   fp8: attention wq_a 1536x7168 + wq_b 65536x1536 + wkv 512x7168 +
#     wo_a 16384x4096 + wo_b 7168x16384 (x 61) = 18_293_456_896; indexer
#     wq_b 8192x1536 (x 30) = 377_487_360; shared expert 3*7168*3072 (x 61)
#     = 4_029_677_568 -> 22_700_621_824
#   bf16: compressors (wkv + wgate 512x7168, x 61) = 667_942_912; indexer
#     compressors (wkv + wgate 256x7168, x 30) = 110_100_480; indexer
#     weights_proj 64x7168 (x 30) = 13_762_560; router 384x7168 (x 61) =
#     167_903_232; head 129280x7168 = 926_679_040; hyper-connection mixing
#     (hc_attn_fn + hc_ffn_fn 24x28672 x 61, hc_head_fn 4x28672; stored F32,
#     folded in here) = 84_066_304 -> active 1_970_454_528; + embedding
#     926_679_040 -> resident 2_897_133_568
# Against deepseek-v4-pro.toml: that entry carries the shared expert in its
# fp4 stream and a rounded non-expert split (active 20.8e9, resident 53e9);
# this split follows the 0813 checkpoint's tensors.

name = "DeepSeek-V4-Pro-0813"
hidden_dim = 7168
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
scale = { group = 32 }
active_params = 24178065408
resident_params = 1547396186112
routing = { routed_experts = 384, experts_per_tok = 6, moe_layers = 61 }

[[weights]]
precision = "fp8"
active_params = 22700621824
resident_params = 22700621824

[[weights]]
precision = "bf16"
active_params = 1970454528
resident_params = 2897133568

[[layers]]
kind = "mla"
count = 30
latent_dim = 512
q_latent_dim = 1536
o_latent_dim = 1024
heads = 128
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128
history = { compress_ratio = 4, index_topk = 1024, indexer = { heads = 64, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }

[[layers]]
