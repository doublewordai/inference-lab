# amd/GLM-5.2-MXFP4 — GLM-5.2 (MLA + DSA + MoE) with MXFP4 experts (AMD Quark).
# Architecture: HF amd/GLM-5.2-MXFP4 config.json matches zai-org/GLM-5.2-FP8's
# in every architecture field (see glm-5.2-fp8.toml for the layout: 78
# layers, MLA 512+64, DSA 32x128 top-2048 with 21 full + 57 shared
# indexers, 75 MoE layers of 256 routed + 1 shared expert, 8 per token).
# Precision, from its quantization_config (Quark, fp4 weights per_group 32
# with e8m0 scales; `exclude` lists every attention, indexer, dense-MLP and
# router module and lm_head) and the safetensors headers: routed and shared
# experts of layers 3-77 MXFP4; everything else BF16. The MTP layer (78) is
# not modelled. KV at --kv-cache-dtype fp8_e4m3 (MI355X).
#
# Param split, exact from the safetensors headers (layers 0-77; norms,
# biases and scales omitted; packed U8 = 2 fp4 params per byte):
#   per expert = 3*6144*2048 = 37_748_736
#   fp4 experts: active  (8 routed + 1 shared) * per * 75 = 25_480_396_800
#                resident (256 + 1)            * per * 75 = 727_606_886_400
#   bf16: MLA projections 165_019_648 x 78 = 12_871_532_544; indexers
#     (wq_b 4096x2048 + wk 128x6144 + weights_proj 32x6144 = 9_371_648)
#     x 21 = 196_804_608; dense FFN 3 x 3*6144*12288 = 679_477_248; router
#     75 x 256x6144 = 117_964_800; lm_head 154880x6144 = 951_582_720
#     -> active 14_817_361_920; + embedding 951_582_720 -> resident
#     15_768_944_640
#
# Modelled directly: 78 DSA MLA layers, top-2048 selection over the
# uncompressed history; 21 layers run their own 32 x 128 indexer, 57 reuse a
# neighbour's scores; attention priced with the true head shape 64 x (256+256).

name = "GLM-5.2-MXFP4"
hidden_dim = 6144
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
scale = { group = 32 }
active_params = 25480396800
resident_params = 727606886400
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 75 }

[[weights]]
precision = "bf16"
active_params = 14817361920
resident_params = 15768944640

[[layers]]
kind = "mla"
count = 21
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256

[[layers]]
kind = "mla"
count = 57
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048 }
heads = 64
qk_head_dim = 256
v_head_dim = 256
