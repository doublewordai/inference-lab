# thinkingmachines/Inkling-NVFP4 — MoE with 55 sliding(512) + 11 full
# attention layers and an 8-deep MTP chain. From HF
# thinkingmachines/Inkling-NVFP4 config.json (text_config):
#   66 layers (local_layer_ids: 55 sliding, window 512; 11 global full);
#   hidden 6144; full attn 64 heads x 128, 8 KV heads; sliding attn 64 heads
#   x 128, 16 KV heads; MoE: 256 routed + 2 shared, 6 per token, expert inter
#   3072 (gated), one dense MLP layer (idx 2, inter 24576); sconv kernel 4;
#   vocab 201024; max_len 1048576; mtp_config: 8 nextn layers (MoE-bearing —
#   included in expert residency, their compute is not modeled).
#
# Param split (computed; shared experts kept in fp4 expert bucket):
#   per expert = 3*6144*3072 = 56_623_104
#   active expert  = (6+2 shared) * per * 65 = 29_444_014_080
#   resident expert= (256+2) * per * (65+8 MTP) = 1_066_439_540_736
#   full attn layer = 113_246_208; swa layer = 125_829_120
#   dense MLP = 452_984_832; router = 102_236_160; lm_head = 1_235_091_456
#   active non-exp = 9_956_622_336; resident non-exp (+embed) = 11_191_713_792
#   Sanity: fp4+bf16 residency ~= 555_603_197_952 B vs
#   checkpoint 591_854_374_368 B (gap = NVFP4 scales).
#
# Modelled directly: 55 sliding(512) layers (16 KV heads) and 11 full layers (8 KV heads) as attention classes; fp4 expert stream with coupon-collector routing over 256 experts, 6 per token.

name = "Inkling-NVFP4"
hidden_dim = 6144
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
active_params = 29444014080
resident_params = 1066439540736
routing = { routed_experts = 256, experts_per_tok = 6, moe_layers = 65 }

[[weights]]
precision = "bf16"
active_params = 9956622336
resident_params = 11191713792

[[layers]]
kind = "attention"
count = 55
heads = 64
head_dim = 128
kv_heads = 16
window = 512
kv_precision = "bf16"

[[layers]]
kind = "attention"
count = 11
heads = 64
head_dim = 128
kv_heads = 8
kv_precision = "bf16"
