# nvidia/GLM-5.2-NVFP4 — GLM-5.2 (MLA + DSA + MoE) with NVFP4 routed experts, BF16 rest.
# Architecture: HF nvidia/GLM-5.2-NVFP4 config.json matches
# zai-org/GLM-5.2-FP8's in every architecture field (see glm-5.2-fp8.toml for
# the layout: 78 layers, MLA 512+64, DSA 32x128 top-2048 with 21 full + 57
# shared indexers, 75 MoE layers of 256 routed + 1 shared expert, 8 per
# token). Precision, from its quantization_config (ModelOpt NVFP4, group 16,
# on every Linear outside its `ignore` list: lm_head, embedding, layers 0-2,
# every self_attn and shared_experts; served with --quantization
# modelopt_fp4) and the safetensors headers: routed experts of layers 3-77
# NVFP4; attention, indexers, dense MLP, shared experts, routers, lm_head
# and embedding BF16. (nvidia/GLM-5.3-NVFP4 keeps the dense MLP at FP8; this
# one does not.) The MTP layer (78, BF16 experts) is not modelled. KV at
# --kv-cache-dtype fp8_e4m3 (B300).
#
# Param split, exact from the safetensors headers (layers 0-77; norms,
# biases and scale tensors omitted; packed U8 = 2 fp4 params per byte):
#   per expert = 3*6144*2048 = 37_748_736
#   fp4 routed:  active   8 * per * 75 = 22_649_241_600
#                resident 256 * per * 75 = 724_775_731_200
#   bf16: MLA projections 165_019_648 x 78 = 12_871_532_544; indexers
#     (wq_b 4096x2048 + wk 128x6144 + weights_proj 32x6144 = 9_371_648)
#     x 21 = 196_804_608; dense FFN 3 x 3*6144*12288 = 679_477_248; shared
#     experts 75 x per = 2_831_155_200; router 75 x 256x6144 = 117_964_800;
#     lm_head 154880x6144 = 951_582_720 -> active 17_648_517_120;
#     + embedding 951_582_720 -> resident 18_600_099_840
#
# Modelled directly: 78 DSA MLA layers, top-2048 selection over the
# uncompressed history; 21 layers run their own 32 x 128 indexer, 57 reuse a
# neighbour's scores; attention priced with the true head shape 64 x (256+256).

name = "GLM-5.2-NVFP4"
hidden_dim = 6144
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
scale = { group = 16 }
active_params = 22649241600
resident_params = 724775731200
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 75 }

[[weights]]
precision = "bf16"
active_params = 17648517120
resident_params = 18600099840

[[layers]]
kind = "mla"
count = 21
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256

[[layers]]
kind = "mla"
count = 57
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048 }
heads = 64
qk_head_dim = 256
v_head_dim = 256
