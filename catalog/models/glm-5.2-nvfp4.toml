# nvidia/GLM-5.2-NVFP4 — the production GLM-5.2 checkpoint on Curie.
# Architecture matches zai-org/GLM-5.2-FP8: 78 MLA+DSA layers, hidden 6144,
# 256 routed + 1 shared expert, 8 routed experts per token, and one MTP layer.
# Target expert weights are NVFP4; attention and other dense weights remain
# bf16. The final resident-only bf16 stream accounts for the checkpoint's MTP,
# quantization scales, and auxiliary tensors. Its size was solved from the
# 2026-09-04 production `sglang:weight_memory_usage_gb` value (77.3671875 GiB
# per GPU) after DP8 attention-projection replication.

name = "GLM-5.2-NVFP4"
hidden_dim = 6144
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
active_params = 25480396800
resident_params = 727606886400
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 75 }

[[weights]]
precision = "bf16"
active_params = 15165554688
resident_params = 16117137408

[[weights]]
precision = "bf16"
active_params = 0
resident_params = 40354971648

[[layers]]
kind = "mla"
count = 21
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048, indexer = { heads = 32, head_dim = 128, kv_precision = "fp8", precision = "fp8" } }
heads = 64
qk_head_dim = 256
v_head_dim = 256

[[layers]]
kind = "mla"
count = 57
latent_dim = 512
q_latent_dim = 2048
rope_dim = 64
kv_precision = "fp8"
window = 0
history = { compress_ratio = 1, index_topk = 2048 }
heads = 64
qk_head_dim = 256
v_head_dim = 256
