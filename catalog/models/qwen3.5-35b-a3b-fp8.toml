# Source: configs/estate/qwen3.5-35b-a3b-fp8-b200.toml
# Qwen/Qwen3.5-35B-A3B-FP8 — hybrid MoE (GatedDeltaNet linear + GQA full
# attention). The HF Qwen/Qwen3.5-35B-A3B-FP8 config.json is architecturally
# IDENTICAL to Qwen/Qwen3.6-35B-A3B: 40 layers = 10 GQA full-attn + 30
# GatedDeltaNet linear, 256-expert MoE with 8 routed + 1 shared,
# moe_intermediate 512, hidden 2048; full attn 16 q / 2 kv heads x 256;
# linear 16 key / 32 value heads x 128, conv 4; vocab 248320. The param
# split below is therefore copied verbatim from
# configs/qwen3.6-35b-a3b-gh200.toml (arithmetic documented there):
#   per-expert 3*2048*512 = 3_145_728
#   active expert (8+1)*per*40 = 1_132_462_080
#   resident expert (256+1)*per*40 = 32_338_083_840
#   active non-exp = 1_725_693_952; resident non-exp = 2_234_253_312
# FP8 weights, KV bf16.

name = "Qwen3.5-35B-A3B-FP8"
hidden_dim = 2048
max_seq_len = 262144
attention_precision = "bf16"

[[weights]]
precision = "fp8"
active_params = 1132462080
resident_params = 32338083840
routing = { routed_experts = 256, experts_per_tok = 8, moe_layers = 40 }

[[weights]]
precision = "fp8"
active_params = 1725693952
resident_params = 2234253312

[[layers]]
kind = "attention"
count = 10
heads = 16
head_dim = 256
kv_heads = 2
kv_precision = "bf16"

[[layers]]
kind = "linear"
count = 30
state_bytes = 1114112
