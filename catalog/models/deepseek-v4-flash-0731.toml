# deepseek-ai/DeepSeek-V4-Flash-0731 — same backbone as DeepSeek-V4-Flash
# (HF deepseek-ai/DeepSeek-V4-Flash-0731 config.json: identical 43 layers,
# hidden 4096, MLA 512+64, same 2 dense / 21 near / 20 far compress layout,
# same 256-expert MoE), plus 3 auxiliary "DSpark" hash layers
# (num_hash_layers=3, dspark_target_layer_ids [40,41,42], markov rank 256)
# and 1 MTP layer that this cost model does not represent. Known bias: the
# DSpark hash-attention work and its cache are omitted (checkpoint is
# 166.9 GB vs the ~154 GB the split below prices; the gap is DSpark + MTP +
# quantization-scale overhead). Production deployment: 8 GPUs.
# Param split (as in catalog/models/deepseek-v4-flash.toml):
#   per expert = 3*4096*2048 = 25_165_824
#   active expert  = (6 routed + 1 shared) * per * 43 = 7_574_913_024
#   resident expert= (256 + 1 shared)      * per * 43 = 278_107_521_024
#   active non-exp (MLA q/kv/o low-rank projections, indexer, dense FFN,
#   lm_head) = 5_660_947_776; resident non-exp = 6_225_000_000.

name = "DeepSeek-V4-Flash-0731"
hidden_dim = 4096
max_seq_len = 1048576
attention_precision = "bf16"

[[weights]]
precision = "fp4"
active_params = 7574913024
resident_params = 278107521024
routing = { routed_experts = 256, experts_per_tok = 6, moe_layers = 43 }

[[weights]]
precision = "fp8"
active_params = 5660947776
resident_params = 6225000000

[[layers]]
kind = "mla"
count = 2
latent_dim = 512
q_latent_dim = 1024
o_latent_dim = 1024
heads = 64
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128

[[layers]]
kind = "mla"
count = 21
latent_dim = 512
q_latent_dim = 1024
o_latent_dim = 1024
heads = 64
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128
history = { compress_ratio = 4, index_topk = 512, indexer = { heads = 64, head_dim = 128, kv_precision = "fp8" } }

[[layers]]
kind = "mla"
count = 20
latent_dim = 512
q_latent_dim = 1024
o_latent_dim = 1024
heads = 64
qk_head_dim = 576
v_head_dim = 512
rope_dim = 64
kv_precision = "fp8"
window = 128
history = { compress_ratio = 128 }
