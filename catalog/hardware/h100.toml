# NVIDIA H100 SXM, dense datasheet peaks; 80 GB HBM3.

name = "H100"
flops_fp8 = 1.979e15
flops_bf16 = 9.895e14
memory_bandwidth = 3.35e12
memory_capacity = 80000000000

# Fabric: HGX H100 — 8 GPUs on NVSwitch (NVLink 4, 900 GB/s bidirectional per
# GPU = 450 GB/s per direction, NVLink SHARP), one ConnectX-7 400 Gb/s NIC per
# GPU rail-optimised across nodes.
[fabric]
gpus_per_node = 8
scale_up = { bandwidth = 4.5e11, latency = 5e-6, in_network_reduction = true }
scale_out = { bandwidth = 5.0e10, latency = 2e-5 }
