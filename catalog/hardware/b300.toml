# NVIDIA B300 (HGX), dense datasheet peaks; 288 GB HBM3e.

name = "B300"
flops_fp4 = 1.35e16
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
