# Fabric: HGX B300 — 8 GPUs on NVSwitch (NVLink 5, 900 GB/s per direction,
# NVLink SHARP), one ConnectX-8 800 Gb/s NIC per GPU rail-optimised across nodes.
[fabric]
gpus_per_node = 8
scale_up = { bandwidth = 9.0e11, latency = 5e-6, in_network_reduction = true }
