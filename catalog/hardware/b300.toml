# NVIDIA B300 (HGX), dense datasheet peaks; 288 GB HBM3e.

name = "B300"
flops_fp4 = 1.35e16
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 288000000000

# Fabric: HGX B300 — 8 GPUs on NVSwitch (NVLink 5, 900 GB/s per direction,
# NVLink SHARP), one ConnectX-8 800 Gb/s NIC per GPU rail-optimised across nodes.
[fabric]
gpus_per_node = 8
scale_up = { bandwidth = 9.0e11, latency = 5e-6, in_network_reduction = true }
scale_out = { bandwidth = 1.0e11, latency = 2e-5 }

# KV memory beyond HBM (see docs: [memory]). Host DRAM is one pool per
# node over each GPU's PCIe Gen5 x16 port (64 GB/s per direction; the host
# CPUs are Gen5). Local NVMe is a node pool of eight U.2 drives; the link
# bandwidth is the drives' aggregate read rate divided across the eight
# GPUs — it rides the same PCIe port as host DRAM, which is not yet charged
# jointly. `nvlink` and `nic` restate the fabric for the memory graph
# (peer-HBM and cross-node paths land with multi-hop transfers).
[memory]
[[memory.stores]]
name = "host_dram"
per = "node"
capacity = 2.0e12

[[memory.stores]]
name = "nvme"
per = "node"
capacity = 3.0e13

[[memory.links]]
name = "pcie"
from = "gpu"
to = "host_dram"
bandwidth = 6.4e10

[[memory.links]]
name = "nvme"
from = "gpu"
to = "nvme"
bandwidth = 7.0e9

[[memory.links]]
name = "nvlink"
from = "gpu"
to = "switch"
bandwidth = 9.0e11

[[memory.links]]
name = "nic"
from = "gpu"
to = "network"
bandwidth = 1.0e11
