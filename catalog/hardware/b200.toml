# NVIDIA B200 (HGX), dense datasheet peaks; 192 GB HBM3e, 8 TB/s.

name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 192000000000

# Fabric: HGX B200 — 8 GPUs on NVSwitch (NVLink 5, 1.8 TB/s bidirectional per
# GPU = 900 GB/s per direction, in-network reduction via NVLink SHARP), one
# ConnectX-7 400 Gb/s NIC per GPU rail-optimised across nodes.
[fabric]
gpus_per_node = 8
scale_up = { bandwidth = 9.0e11, latency = 5e-6, in_network_reduction = true }
scale_out = { bandwidth = 5.0e10, latency = 2e-5 }

# KV memory beyond HBM (see docs: [memory]). Each GPU's PCIe Gen5 x16 port
# (64 GB/s per direction; the host CPUs are Gen5) is a junction that feeds
# both host DRAM — one pool per node — and the node's NVMe pool, whose own
# throughput (eight U.2 drives, ~7 GB/s each) bounds every transfer in or
# out of it. `nvlink` and `nic` restate the fabric for the memory graph:
# NVLink per-GPU ports into the node's switch, one NIC per GPU to the
# network core.
[memory]
[[memory.stores]]
name = "host_dram"
per = "node"
capacity = 2.0e12

[[memory.stores]]
name = "nvme"
per = "node"
capacity = 3.0e13
bandwidth = 5.6e10

# Optional four-node storage pool. Deployments must name `cluster_nvme` in
# their `[memory] tiers` to instantiate it; the default catalog entries do not.
[[memory.stores]]
name = "cluster_nvme"
per = "cluster"
capacity = 1.2e14
bandwidth = 5.6e10
stripe = 4
latency = 2e-3

[[memory.junctions]]
name = "pcie"
per = "gpu"

[[memory.links]]
name = "pcie"
from = "gpu"
to = "pcie"
bandwidth = 6.4e10

[[memory.links]]
name = "pcie-host"
from = "pcie"
to = "host_dram"
bandwidth = 1.0e12

[[memory.links]]
name = "pcie-nvme"
from = "pcie"
to = "nvme"
bandwidth = 1.0e12

[[memory.links]]
name = "nvlink"
from = "gpu"
to = "switch"
bandwidth = 9.0e11

[[memory.links]]
name = "nic"
from = "gpu"
to = "network"
bandwidth = 5.0e10

[[memory.links]]
name = "cluster-storage"
from = "network"
to = "cluster_nvme"
bandwidth = 1.0e12
