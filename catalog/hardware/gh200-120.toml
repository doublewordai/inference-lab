# NVIDIA GH200 Grace Hopper, 120 GB HBM3 variant (Hopper: fp4 runs at the fp8 rate).

name = "GH200-120"
flops_fp4 = 1.979e15
flops_fp8 = 1.979e15
flops_bf16 = 9.89e14
flops_fp16 = 9.89e14
memory_bandwidth = 4.0e12
memory_capacity = 102642221056

# Fabric: 4-GPU GH200 node (Isambard-AI) — GPUs joined by NVLink 4 (900 GB/s
# bidirectional per GPU = 450 GB/s per direction; point-to-point, no NVSwitch
# reduction), one Slingshot-11 200 Gb/s NIC per GPU across nodes.
[fabric]
gpus_per_node = 4
scale_up = { bandwidth = 4.5e11, latency = 5e-6 }
scale_out = { bandwidth = 2.5e10, latency = 2e-5 }
