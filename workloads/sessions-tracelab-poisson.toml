# Agentic sessions replayed from TraceLab (export with
# examples/sessions/tracelab_export.py into data/sessions/tracelab.jsonl).
# Sessions start as a Poisson process at 0.05/s; each later step of a session
# arrives at its parent's completion plus the recorded gap. The length
# distributions are ignored in session mode.

sessions_path = "data/sessions/tracelab.jsonl"
arrival_pattern = "poisson"
arrival_rate = 0.05
num_sessions = 200
seed = 42

[input_len_dist]
type = "fixed"
value = 1

[output_len_dist]
type = "fixed"
value = 1
