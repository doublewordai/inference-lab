# 512 closed-loop users, 4000 requests; median ISL 403 / OSL 403 tokens.

arrival_pattern = "closed_loop"
num_concurrent_users = 512
closed_loop_jitter_secs = 0.05
num_requests = 4000
seed = 7

[input_len_dist]
type = "lognormal"
mean = 6.0
std_dev = 0.5

[output_len_dist]
type = "lognormal"
mean = 6.0
std_dev = 1.0
