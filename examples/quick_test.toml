# Quick test config for CLI testing
# H100 with small number of requests

# Presets ship in the crate catalog (inference_lab::catalog); replace either with an
# inline [hardware] / [model] table to override.
hardware = "h100"
model = "llama-3-70b-fp8"

[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 100
policy = "fcfs"
enable_chunked_prefill = true
block_size = 16

[workload]
arrival_pattern = "poisson"
arrival_rate = 2.0
num_requests = 50            # Small for quick testing
seed = 42

[workload.input_len_dist]
type = "lognormal"
mean = 6
std_dev = 0.5

[workload.output_len_dist]
type = "lognormal"
mean = 5
std_dev = 0.5
