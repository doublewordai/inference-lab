# === Estate serving config: Qwen/Qwen3-14B-FP8 on 1x B200 (tp=1) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# Qwen/Qwen3-14B-FP8 — plain dense GQA transformer. From HF
# Qwen/Qwen3-14B-FP8 config.json: 40 layers, hidden 5120, 40 heads x head_dim
# 128, 8 KV heads, full attention, MLP inter 17408, vocab 151936 (untied),
# max_pos 40960, FP8 quantization. `qwen35` with zero experts / all layers
# attention (plain GQA with separate bf16 KV precision).
#
# Param split (all non-expert; computed):
#   attn/layer (q 40x128 + k,v 8x128 + o) = 5120*12288 = 62_914_560
#   MLP/layer = 3*5120*17408 = 267_386_880
#   lm_head = 151936*5120 = 777_912_320
#   active = 40*(attn+mlp) + lm_head = 13_989_969_920
#   resident (+embedding) = 14_767_882_240  (advertised 14.8B)

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "Qwen3-14B-FP8"
num_layers = 40
hidden_dim = 5120
max_seq_len = 40960

num_attention_layers = 40
num_attention_heads = 40
num_kv_heads = 8
attn_head_dim = 128

linear_num_value_heads = 0
linear_num_key_heads = 0
linear_key_head_dim = 0
linear_value_head_dim = 0
linear_conv_kernel = 0

num_active_expert_params = 0
num_active_non_expert_params = 13989969920
num_resident_expert_params = 0
num_resident_non_expert_params = 14767882240

num_experts_per_tok = 0
num_routed_experts = 0
num_moe_layers = 0

expert_precision = "fp8"
non_expert_precision = "fp8"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
