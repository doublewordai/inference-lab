# === Estate serving config: openai/gpt-oss-120b on 4x GH200 (tp=4) ===
# Hardware: GH200-120 (fp8/fp4 1.979e15, bf16 0.989e15 FLOP/s, 4.0e12 B/s, 96 GB usable).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# openai/gpt-oss-120b — MoE with alternating sliding(128)/full attention.
# From HF openai/gpt-oss-120b config.json:
#   36 layers (18 sliding_attention + 18 full_attention, strictly
#   alternating), hidden 2880, 64 heads x head_dim 64, 8 KV heads,
#   sliding_window 128; MoE every layer: 128 experts, 4 per token, gated
#   inter 2880 (native MXFP4 expert weights); vocab 201088; max_pos 131072
#   (YaRN x32). Attention/embeddings bf16.
#
# qwen35 mapping:
#   - 18 full-attention layers exact: H=64 x 64, kv_heads 8.
#   - 18 sliding layers as fixed per-seq state: window 128 x (2*8*64 KV
#     elems) = 131_072 elems = 256 KB/layer/seq bf16 -> value_heads=8 x 128 x
#     128. Sliding-window attention flops beyond the window are dropped
#     (window is 128 — negligible).
#   - MoE coupon-collector: 128 routed, 4/tok, knee at E/k = 32.
#
# Param split (computed):
#   per expert (gated, inter 2880) = 3*2880*2880 = 24_883_200
#   active expert  = 4 * per * 36   = 3_583_180_800
#   resident expert= 128 * per * 36 = 114_661_785_600
#   attn/layer (q 64x64 + kv 8x64 + o) = 2880*9216 = 26_542_080; x36 = 955_514_880
#   router = 13_271_040; lm_head = 201088*2880 = 579_133_440
#   active non-exp = 1_547_919_360; resident non-exp (+embed) = 2_127_052_800
#   Sanity: fp4+bf16 residency ~= 61_584_998_400 B vs checkpoint 65_248_815_744.

[hardware]
name = "GH200-120"
flops_fp4 = 1.979e15
flops_fp8 = 1.979e15
flops_bf16 = 0.989e15
flops_fp16 = 0.989e15
memory_bandwidth = 4.0e12
memory_capacity = 102642221056   # 96 GB usable of 120
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 4
ep = 1

[model]
type = "qwen35"
name = "gpt-oss-120b"
num_layers = 36
hidden_dim = 2880
max_seq_len = 131072

num_attention_layers = 18
num_attention_heads = 64
num_kv_heads = 8
attn_head_dim = 64

# Sliding(128) layers as fixed-size state (see header).
linear_num_value_heads = 8
linear_num_key_heads = 0
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 0

num_active_expert_params = 3583180800
num_active_non_expert_params = 1547919360
num_resident_expert_params = 114661785600
num_resident_non_expert_params = 2127052800

num_experts_per_tok = 4
num_routed_experts = 128
num_moe_layers = 36

expert_precision = "fp4"
non_expert_precision = "bf16"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
