# === Estate serving config: moonshotai/kimi-k3 on 8x B200 (tp=8) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# moonshotai/kimi-k3 — KimiLinear hybrid: 69 KDA (Kimi Delta Attention,
# linear) + 24 full MLA layers, latent MoE. From HF moonshotai/kimi-k3
# config.json (text_config, model_type kimi_linear):
#   93 layers (linear_attn_config: 69 kda_layers + 24 full_attn_layers),
#   hidden 7168, 96 heads; MLA kv_lora 512 + rope 64 (qk_nope 128, v 128);
#   KDA: 96 heads x head_dim 128, short_conv 4; MoE: 896 routed experts,
#   16 per token, 2 shared, latent experts (routed_expert_hidden_size 3584,
#   moe_intermediate 3072), first layer dense (inter 33792); vocab 163840;
#   max_pos 1048576. Routed experts mxfp4 (compressed-tensors); attention,
#   shared experts, dense MLP bf16.
#
# qwen35 mapping:
#   - 24 MLA layers as the "attention" layers with EFFECTIVE head numbers
#     chosen to reproduce the arithmetic (not literal): KV/token/layer = MLA
#     latent 512 + rope 64 = 576 elems -> num_kv_heads=1 x attn_head_dim 288
#     x 2; attention-flop inner = true QK+AV volume 96*(192+128)/2 = 15360
#     -> num_attention_heads=53 (53*288 = 15264, 0.6% low).
#   - 69 KDA layers as linear layers: state = 96 heads x 128 x 128 elems
#     (+ conv 4 x qkv channels), i.e. value/key heads 96, dims 128, conv 4.
#   - MoE coupon-collector: 896 routed, 16/tok.
# WARNING (documented non-fit): resident weights are ~1_449_351_120_896 B
# (checkpoint is 1_560_860_324_864 B with mxfp4 scales) — this does NOT fit
# an 8x B200 node (0.9 * 8 * 180 GB = 1391 GB usable). The model never
# appears with a footprint in the scouter archive; the config exists so the
# alias is representable, per the archive fallback of 8 GPUs on b200.
#
# Param split (computed; latent-expert internals are the main uncertainty —
# per-expert = 3 * routed_expert_hidden 3584 * moe_inter 3072):
#   per expert = 33_030_144
#   active routed = 16 * per * 92  = 48_620_371_968
#   resident routed = 896 * per * 92 = 2_722_740_830_208
#   per-MLA-layer = 144_113_664; per-KDA-layer (q,k,v,gate + out) = 440_401_920
#   shared experts (2 * per * 92) = 6_077_546_496  [bf16 -> non-expert bucket]
#   dense FFN = 726_663_168; router = 590_872_576; lm_head = 1_174_405_120
#   active non-exp = 42_415_947_776; resident non-exp = 43_990_352_896

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 8
ep = 1

[model]
type = "qwen35"
name = "kimi-k3"
num_layers = 93
hidden_dim = 7168
max_seq_len = 1048576

# Effective MLA-equivalent attention numbers — see header.
num_attention_layers = 24
num_attention_heads = 53
num_kv_heads = 1
attn_head_dim = 288

linear_num_value_heads = 96
linear_num_key_heads = 96
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 4

num_active_expert_params = 48620371968
num_active_non_expert_params = 42415947776
num_resident_expert_params = 2722740830208
num_resident_non_expert_params = 43990352896

num_experts_per_tok = 16
num_routed_experts = 896
num_moe_layers = 92

expert_precision = "fp4"
non_expert_precision = "bf16"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
