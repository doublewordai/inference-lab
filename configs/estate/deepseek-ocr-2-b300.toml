# === Estate serving config: deepseek-ai/DeepSeek-OCR-2 on 1x B300 (tp=1) ===
# Hardware: B300 (dense datasheet: fp4 13.5e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 8.0e12 B/s, 288 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# deepseek-ai/DeepSeek-OCR-2 — DeepseekV2-style small MoE language stack
# behind a DeepEncoder vision front-end. From HF deepseek-ai/DeepSeek-OCR-2
# config.json (language_config, use_mla=false -> plain MHA):
#   12 layers, hidden 1280, 10 heads x 128 (MHA: 10 KV heads), first layer
#   dense (inter 6848), 11 MoE layers: 64 routed + 2 shared experts, 6 per
#   token, moe_intermediate 896; vocab 129280; max_pos 8192; bf16.
# Modeled by `qwen35` with num_attention_layers = num_layers (plain GQA MoE).
# Vision encoder (~0.9B: SAM-b + qwen2-0.5b deepencoder) counted in residency
# only.
#
# Param split (computed):
#   per expert = 3*1280*896 = 3_440_640
#   active expert  = (6 routed + 2 shared) * per * 11 = 302_776_320
#   resident expert= (64 + 2)              * per * 11 = 2_497_904_640
#   attn/layer (q+k+v+o, all 1280x1280) = 6_553_600; x12 = 78_643_200
#   dense FFN = 3*1280*6848 = 26_296_320; router = 901_120
#   lm_head = 129280*1280 = 165_478_400
#   active non-exp = 271_319_040
#   resident non-exp = checkpoint 6_779_249_408 B / 2 - resident expert
#                    = 891_720_064 (embedding + vision encoder)

[hardware]
name = "B300"
flops_fp4 = 13.5e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 309237645312   # 288 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "DeepSeek-OCR-2"
num_layers = 12
hidden_dim = 1280
max_seq_len = 8192

num_attention_layers = 12
num_attention_heads = 10
num_kv_heads = 10
attn_head_dim = 128

linear_num_value_heads = 0
linear_num_key_heads = 0
linear_key_head_dim = 0
linear_value_head_dim = 0
linear_conv_kernel = 0

num_active_expert_params = 302776320
num_active_non_expert_params = 271319040
num_resident_expert_params = 2497904640
num_resident_non_expert_params = 891720064

num_experts_per_tok = 6
num_routed_experts = 64
num_moe_layers = 11

expert_precision = "bf16"
non_expert_precision = "bf16"
kv_precision = "bf16"

# Engine args from internal/inference/node catalogs (b300; backend sglang; backend defaults for chunked_prefill, max_running):
# mem-fraction/chunked-prefill/max-running -> 0.9/8192/4096
[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 4096
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
