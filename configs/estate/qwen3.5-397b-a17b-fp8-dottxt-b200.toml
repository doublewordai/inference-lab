# === Estate serving config: Qwen/Qwen3.5-397B-A17B-FP8 on 4x B200 (tp=4) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# Qwen/Qwen3.5-397B-A17B-FP8 — hybrid MoE (GatedDeltaNet linear + GQA full attention),
# same family as the Qwen3.6-35B template (configs/qwen3.6-35b-a3b-gh200.toml).
# From HF Qwen/Qwen3.5-397B-A17B-FP8 config.json (text_config):
#   60 layers, full_attention_interval 4 -> 15 full-attn + 45 GatedDeltaNet
#   linear; hidden 4096; full attn: 32 q / 2 kv heads, head_dim 256; linear:
#   16 key / 64 value heads, key/value head_dim 128, conv kernel 4; MoE every
#   layer: 512 routed + 1 shared expert, 10 per token, moe_intermediate
#   1024 (shared_expert_intermediate 1024); vocab 248320; 1 MTP layer
#   (not modeled); FP8 quantization; max_pos 262144.
#
# Param split (computed, template arithmetic):
#   per expert = 3*4096*1024 = 12_582_912
#   active expert  = (10 routed + 1 shared) * per * 60 = 8_304_721_920
#   resident expert= (512 + 1 shared)      * per * 60 = 387_302_031_360
#   full-attn layer (q+o 32x256, k+v 2x256) = 4096*17408 = 71_303_168
#   linear layer (qkvz + out; 2*Hk*dk + 3*Hv*dv) = 4096*28672 = 117_440_512
#   router = 125_829_120; lm_head = 248320*4096 = 1_017_118_720
#   active non-exp = 15*attn + 45*linear + router + lm_head = 7_497_318_400
#   resident non-exp (+embedding) = 8_514_437_120
#   Sanity: fp8 residency ~= 395_816_468_480 B vs checkpoint 406_125_181_280 B.

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 4
ep = 1

[model]
type = "qwen35"
name = "Qwen3.5-397B-A17B-FP8"
num_layers = 60
hidden_dim = 4096
max_seq_len = 262144

num_attention_layers = 15
num_attention_heads = 32
num_kv_heads = 2
attn_head_dim = 256

linear_num_value_heads = 64
linear_num_key_heads = 16
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 4

num_active_expert_params = 8304721920
num_active_non_expert_params = 7497318400
num_resident_expert_params = 387302031360
num_resident_non_expert_params = 8514437120

num_experts_per_tok = 10
num_routed_experts = 512
num_moe_layers = 60

expert_precision = "fp8"
non_expert_precision = "fp8"
kv_precision = "bf16"

# Engine args from internal/inference/node catalogs (b200; backend sglang; backend defaults for max_running):
# mem-fraction/chunked-prefill/max-running -> 0.8/16384/4096
[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 1024
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
