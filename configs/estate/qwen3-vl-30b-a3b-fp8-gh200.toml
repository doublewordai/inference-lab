# === Estate serving config: Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 on 1x GH200 (tp=1) ===
# Hardware: GH200-120 (fp8/fp4 1.979e15, bf16 0.989e15 FLOP/s, 4.0e12 B/s, 96 GB usable).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 — GQA MoE vision-language model.
# From HF Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 config.json (text_config):
#   48 layers, hidden 2048, 32 heads x head_dim 128, 4 KV heads, full
#   attention; MoE every layer (decoder_sparse_step 1): 128 experts, 8 per
#   token, moe_intermediate 768, no shared expert; vocab 151936;
#   max_pos 262144; FP8. Vision tower (27-layer SigLIP-style, ~0.45B) is
#   counted in residency only — image encode compute is outside this model.
# `qwen35` with num_attention_layers = num_layers (plain GQA MoE; coupon
# knee at E/k = 16).
#
# Param split (computed):
#   per expert = 3*2048*768 = 4_718_592
#   active expert  = 8 * per * 48   = 1_811_939_328
#   resident expert= 128 * per * 48 = 28_991_029_248
#   attn/layer (q+o 32x128, k+v 4x128) = 2048*9216 = 18_874_368; x48 = 905_969_664
#   router = 12_582_912; lm_head = 151936*2048 = 311_164_928
#   active non-exp = 1_229_717_504
#   resident non-exp (+embed +vision ~0.45e9) = 1_990_882_432
#   Sanity: ~30.5B total / ~3.0B active (advertised 30B-A3B).

[hardware]
name = "GH200-120"
flops_fp4 = 1.979e15
flops_fp8 = 1.979e15
flops_bf16 = 0.989e15
flops_fp16 = 0.989e15
memory_bandwidth = 4.0e12
memory_capacity = 102642221056   # 96 GB usable of 120
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "Qwen3-VL-30B-A3B-Instruct-FP8"
num_layers = 48
hidden_dim = 2048
max_seq_len = 262144

num_attention_layers = 48
num_attention_heads = 32
num_kv_heads = 4
attn_head_dim = 128

linear_num_value_heads = 0
linear_num_key_heads = 0
linear_key_head_dim = 0
linear_value_head_dim = 0
linear_conv_kernel = 0

num_active_expert_params = 1811939328
num_active_non_expert_params = 1229717504
num_resident_expert_params = 28991029248
num_resident_non_expert_params = 1990882432

num_experts_per_tok = 8
num_routed_experts = 128
num_moe_layers = 48

expert_precision = "fp8"
non_expert_precision = "fp8"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
