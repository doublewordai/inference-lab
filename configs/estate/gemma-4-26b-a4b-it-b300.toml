# === Estate serving config: google/gemma-4-26B-A4B-it on 2x B300 (tp=2) ===
# Hardware: B300 (dense datasheet: fp4 13.5e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 8.0e12 B/s, 288 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# google/gemma-4-26B-A4B-it — MoE hybrid: 25 sliding(1024) + 5 full-attention
# layers, every layer MoE. From HF google/gemma-4-26B-A4B-it config.json
# (gated repo, fetched with the local HF token):
#   30 layers (25 sliding_attention + 5 full_attention), hidden 2816, 16 q heads;
#   sliding: head_dim 256, 8 KV heads; full: global_head_dim 512, 2 global KV
#   heads; attention_k_eq_v=true (single shared K=V tensor); sliding_window 1024;
#   MoE: 128 experts, top_k 8, moe_intermediate 704, plus a dense per-layer MLP
#   (intermediate 2112) treated as an always-on shared path; vocab 262144, tied.
#
# `qwen35` mapping (same scheme as gemma-4-31b-it):
#   - 5 full-attn layers: H=16 x attn_head_dim 512 (flops), kv_heads=1 ->
#     2*1*512 = 1024 elems/token/layer = true k_eq_v KV (2 heads x 512).
#   - 25 sliding layers -> fixed state: 1024-token window x (8*256 k_eq_v) =
#     2_097_152 elems = 4.19 MB/layer/seq bf16, encoded value_heads=128 x 128 x
#     128. Same biases as the 31B config (reserved from t=0; window flops dropped).
#   - MoE coupon-collector over 128 routed experts, 8/tok, knee at E/k = 16.
#
# Param split (computed, bf16):
#   per expert (gated, moe_inter 704) = 3*2816*704 = 5_947_392
#   active expert  = 8 * per * 30   = 1_427_374_080
#   resident expert= 128 * per * 30 = 22_837_985_280
#   active non-exp = 25*sl_attn(28_835_840) + 5*fl_attn(49_020_928)
#                    + 30*shared_mlp(17_842_176) + router(10_813_440)
#                    + lm_head/embed tied(738_197_504) = 2_250_276_864
#   resident non-exp = checkpoint 51_611_872_412 B / 2 - resident expert
#                    = 2_967_950_926  (captures vision tower + norms)

[hardware]
name = "B300"
flops_fp4 = 13.5e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 309237645312   # 288 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 2
ep = 1

[model]
type = "qwen35"
name = "gemma-4-26B-A4B-it"
num_layers = 30
hidden_dim = 2816
max_seq_len = 262144

num_attention_layers = 5
num_attention_heads = 16
num_kv_heads = 1
attn_head_dim = 512

# Sliding layers as fixed-size state (see header).
linear_num_value_heads = 128
linear_num_key_heads = 0
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 0

num_active_expert_params = 1427374080
num_active_non_expert_params = 2250276864
num_resident_expert_params = 22837985280
num_resident_non_expert_params = 2967950926

num_experts_per_tok = 8
num_routed_experts = 128
num_moe_layers = 30

expert_precision = "bf16"
non_expert_precision = "bf16"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
