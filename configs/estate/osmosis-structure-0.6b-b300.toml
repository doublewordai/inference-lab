# === Estate serving config: osmosis-ai/Osmosis-Structure-0.6B on 1x B300 (tp=1) ===
# Hardware: B300 (dense datasheet: fp4 13.5e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 8.0e12 B/s, 288 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# osmosis-ai/Osmosis-Structure-0.6B — Qwen3-0.6B dense GQA fine-tune.
# From HF osmosis-ai/Osmosis-Structure-0.6B config.json: 28 layers, hidden
# 1024, 16 heads x head_dim 128, 8 KV heads, full attention, MLP inter 3072,
# vocab 151936 (tied), max_pos 40960. Served bf16.
# `qwen35` with zero experts / all layers attention.
#
# Param split (all non-expert; computed):
#   attn/layer = 1024*6144 = 6_291_456; MLP/layer = 9_437_184
#   lm_head (tied) = 155_582_464
#   active = 28*(attn+mlp) + lm_head = 595_984_384
#   resident = 595_984_384 (tied embeddings, single copy)

[hardware]
name = "B300"
flops_fp4 = 13.5e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 309237645312   # 288 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.8

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "Osmosis-Structure-0.6B"
num_layers = 28
hidden_dim = 1024
max_seq_len = 40960

num_attention_layers = 28
num_attention_heads = 16
num_kv_heads = 8
attn_head_dim = 128

linear_num_value_heads = 0
linear_num_key_heads = 0
linear_key_head_dim = 0
linear_value_head_dim = 0
linear_conv_kernel = 0

num_active_expert_params = 0
num_active_non_expert_params = 595984384
num_resident_expert_params = 0
num_resident_non_expert_params = 595984384

num_experts_per_tok = 0
num_routed_experts = 0
num_moe_layers = 0

expert_precision = "bf16"
non_expert_precision = "bf16"
kv_precision = "bf16"

# Engine args from internal/inference/node catalogs (b300; backend sglang; backend defaults for chunked_prefill, max_running):
# mem-fraction/chunked-prefill/max-running -> 0.8/8192/4096
[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 4096
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
