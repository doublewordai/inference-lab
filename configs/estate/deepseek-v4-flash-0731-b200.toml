# === Estate serving config: deepseek-ai/DeepSeek-V4-Flash-0731 on 8x B200 (tp=8) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# deepseek-ai/DeepSeek-V4-Flash-0731 — same backbone as DeepSeek-V4-Flash
# (HF deepseek-ai/DeepSeek-V4-Flash-0731 config.json: identical 43 layers,
# hidden 4096, MLA 512+64, same 2 dense / 21 near / 20 far compress layout,
# same 256-expert MoE), plus 3 auxiliary "DSpark" hash layers
# (num_hash_layers=3, dspark_target_layer_ids [40,41,42], markov rank 256)
# and 1 MTP layer that this cost model does not represent. Known bias: the
# DSpark hash-attention work and its cache are omitted (checkpoint is
# 166.9 GB vs the ~154 GB the split below prices; the gap is DSpark + MTP +
# quantization-scale overhead). Estate deployment: 8 GPUs.
# Param split (as in configs/deepseek-v4-flash.toml):
#   per expert = 3*4096*2048 = 25_165_824
#   active expert  = (6 routed + 1 shared) * per * 43 = 7_574_913_024
#   resident expert= (256 + 1 shared)      * per * 43 = 278_107_521_024
#   active non-exp (MLA q/kv/o low-rank projections, indexer, dense FFN,
#   lm_head) = 5_660_947_776; resident non-exp = 6_225_000_000.

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.88

[parallel]
tp = 8
ep = 1

[model]
type = "deepseek_v4"
name = "DeepSeek-V4-Flash-0731"
num_layers = 43
hidden_dim = 4096
num_heads = 64
max_seq_len = 1048576
kv_latent_dim = 512
qk_rope_head_dim = 64
kv_precision = "fp8"
num_active_expert_params = 7574913024
num_active_non_expert_params = 5660947776
num_resident_expert_params = 278107521024
num_resident_non_expert_params = 6225000000
expert_precision = "fp4"
non_expert_precision = "fp8"
window_size = 128
num_dense_layers = 2
num_near_layers = 21
num_far_layers = 20
near_compress_ratio = 4
far_compress_ratio = 128
index_topk = 512
index_n_heads = 64
index_head_dim = 128
num_experts_per_tok = 6
num_routed_experts = 256
num_moe_layers = 43

# Engine args from internal/inference/node catalogs (b200; backend sglang; backend defaults for mem_frac, chunked_prefill, max_running):
# mem-fraction/chunked-prefill/max-running -> 0.88/8192/4096
[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 4096
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
