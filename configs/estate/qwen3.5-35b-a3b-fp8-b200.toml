# === Estate serving config: Qwen/Qwen3.5-35B-A3B-FP8 on 1x B200 (tp=1) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# Qwen/Qwen3.5-35B-A3B-FP8 — hybrid MoE (GatedDeltaNet linear + GQA full
# attention). The HF Qwen/Qwen3.5-35B-A3B-FP8 config.json is architecturally
# IDENTICAL to Qwen/Qwen3.6-35B-A3B: 40 layers = 10 GQA full-attn + 30
# GatedDeltaNet linear, 256-expert MoE with 8 routed + 1 shared,
# moe_intermediate 512, hidden 2048; full attn 16 q / 2 kv heads x 256;
# linear 16 key / 32 value heads x 128, conv 4; vocab 248320. The param
# split below is therefore copied verbatim from
# configs/qwen3.6-35b-a3b-gh200.toml (arithmetic documented there):
#   per-expert 3*2048*512 = 3_145_728
#   active expert (8+1)*per*40 = 1_132_462_080
#   resident expert (256+1)*per*40 = 32_338_083_840
#   active non-exp = 1_725_693_952; resident non-exp = 2_234_253_312
# FP8 weights, KV bf16.

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.8

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "Qwen3.5-35B-A3B-FP8"
num_layers = 40
hidden_dim = 2048
max_seq_len = 262144

num_attention_layers = 10
num_attention_heads = 16
num_kv_heads = 2
attn_head_dim = 256

linear_num_value_heads = 32
linear_num_key_heads = 16
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 4

num_active_expert_params = 1132462080
num_active_non_expert_params = 1725693952
num_resident_expert_params = 32338083840
num_resident_non_expert_params = 2234253312

num_experts_per_tok = 8
num_routed_experts = 256
num_moe_layers = 40

expert_precision = "fp8"
non_expert_precision = "fp8"
kv_precision = "bf16"

# Engine args from internal/inference/node catalogs (b200; backend sglang; backend defaults for max_running):
# mem-fraction/chunked-prefill/max-running -> 0.8/16384/4096
[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 4096
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
