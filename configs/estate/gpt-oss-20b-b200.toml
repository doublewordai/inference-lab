# === Estate serving config: openai/gpt-oss-20b on 1x B200 (tp=1) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# openai/gpt-oss-20b — MoE with alternating sliding(128)/full attention.
# From HF openai/gpt-oss-20b config.json:
#   24 layers (12 sliding_attention + 12 full_attention, strictly
#   alternating), hidden 2880, 64 heads x head_dim 64, 8 KV heads,
#   sliding_window 128; MoE every layer: 32 experts, 4 per token, gated
#   inter 2880 (native MXFP4 expert weights); vocab 201088; max_pos 131072
#   (YaRN x32). Attention/embeddings bf16.
#
# qwen35 mapping:
#   - 12 full-attention layers exact: H=64 x 64, kv_heads 8.
#   - 12 sliding layers as fixed per-seq state: window 128 x (2*8*64 KV
#     elems) = 131_072 elems = 256 KB/layer/seq bf16 -> value_heads=8 x 128 x
#     128. Sliding-window attention flops beyond the window are dropped
#     (window is 128 — negligible).
#   - MoE coupon-collector: 32 routed, 4/tok, knee at E/k = 8.
#
# Param split (computed):
#   per expert (gated, inter 2880) = 3*2880*2880 = 24_883_200
#   active expert  = 4 * per * 24   = 2_388_787_200
#   resident expert= 32 * per * 24 = 19_110_297_600
#   attn/layer (q 64x64 + kv 8x64 + o) = 2880*9216 = 26_542_080; x24 = 637_009_920
#   router = 2_211_840; lm_head = 201088*2880 = 579_133_440
#   active non-exp = 1_218_355_200; resident non-exp (+embed) = 1_797_488_640
#   Sanity: fp4+bf16 residency ~= 13_150_126_080 B vs checkpoint ~13.8e9 B.

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "gpt-oss-20b"
num_layers = 24
hidden_dim = 2880
max_seq_len = 131072

num_attention_layers = 12
num_attention_heads = 64
num_kv_heads = 8
attn_head_dim = 64

# Sliding(128) layers as fixed-size state (see header).
linear_num_value_heads = 8
linear_num_key_heads = 0
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 0

num_active_expert_params = 2388787200
num_active_non_expert_params = 1218355200
num_resident_expert_params = 19110297600
num_resident_non_expert_params = 1797488640

num_experts_per_tok = 4
num_routed_experts = 32
num_moe_layers = 24

expert_precision = "fp4"
non_expert_precision = "bf16"
kv_precision = "bf16"

# Engine args from internal/inference/node catalogs (b200; backend sglang; backend defaults for chunked_prefill, max_running):
# mem-fraction/chunked-prefill/max-running -> 0.9/8192/4096
[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 4096
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
