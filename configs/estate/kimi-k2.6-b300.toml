# === Estate serving config: moonshotai/Kimi-K2.6 on 8x B300 (tp=8) ===
# Hardware: B300 (dense datasheet: fp4 13.5e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 8.0e12 B/s, 288 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# moonshotai/Kimi-K2.6 — DeepSeek-V3-family MLA MoE (text_config
# architectures DeepseekV3ForCausalLM, model_type kimi_k2). From HF
# moonshotai/Kimi-K2.6 config.json:
#   61 layers, hidden 7168, 64 heads; MLA kv_lora_rank 512 + qk_rope 64
#   (q_lora 1536, qk_nope 128, v_head 128); full attention (no DSA/NSA);
#   first layer dense (inter 18432), 60 MoE layers: 384 routed + 1 shared,
#   8 per token, moe_intermediate 2048; vocab 163840; max_pos 262144.
#   Quantization (compressed-tensors): routed experts int4 g32; attention,
#   shared expert, dense MLP, lm_head stay bf16.
#
# deepseek_v4 mapping for plain full-context MLA: no window, all 61 layers
# "near" with compress_ratio 1 and index_topk = max_seq_len (attended = t,
# nothing compressed), indexer heads/dims = 0 (no indexer exists, so its
# flop/byte charges vanish). KV/token/layer = latent 512 + rope 64 at bf16.
# Known biases:
#   - routed experts are int4-g32 (0.5625 B/param with scales); priced as fp4
#     (0.5 B/param) -> residency undercounted ~63 GB; and expert GEMMs run at
#     the fp4 FLOP rate while real w4a16 kernels compute at bf16 -> large-batch
#     expert compute is underpriced (decode is bandwidth-bound, so the byte
#     side, which is right, dominates).
#   - attention FLOPs charged at 4*hidden per (s,t) vs true MLA inner
#     64*(192 qk + 128 v) = 20480 elem -> ~0.7x undercount (accepted bias).
#
# Param split (computed; shared expert bucketed non-expert because it is NOT
# int4-quantized):
#   per expert = 3*7168*2048 = 44_040_192
#   active routed expert  = 8 * per * 60   = 21_139_292_160
#   resident routed expert= 384 * per * 60 = 1_014_686_023_680
#   per-layer MLA (q_a 7168x1536 + q_b 1536x12288 + kv_a 7168x576 +
#     kv_b 512x16384 + o 8192x7168) = 101_122_048; x61 = 6_168_444_928
#   dense FFN = 396_361_728; shared expert x60 = 2_642_411_520
#   router = 165_150_720; lm_head = 1_174_405_120
#   active non-exp = 10_546_774_016
#   resident non-exp (+embed +vision ~0.4e9) = 12_121_179_136
#   Sanity: fp4-priced residency ~= 531_585_370_112 B vs
#   checkpoint ~595e9 (same tensors as K2.5) B (gap = int4 group scales).

[hardware]
name = "B300"
flops_fp4 = 13.5e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 309237645312   # 288 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 8
ep = 1

[model]
type = "deepseek_v4"
name = "Kimi-K2.6"
num_layers = 61
hidden_dim = 7168
num_heads = 64
max_seq_len = 262144
kv_latent_dim = 512
qk_rope_head_dim = 64
kv_precision = "bf16"
num_active_expert_params = 21139292160
num_active_non_expert_params = 10546774016
num_resident_expert_params = 1014686023680
num_resident_non_expert_params = 12121179136
expert_precision = "fp4"
non_expert_precision = "bf16"
# Full MLA attention: near layers at compress_ratio 1 with an uncapped top-k
# and a zero-size indexer (see header).
window_size = 0
num_dense_layers = 0
num_near_layers = 61
num_far_layers = 0
near_compress_ratio = 1
far_compress_ratio = 128
index_topk = 262144
index_n_heads = 0
index_head_dim = 0
num_experts_per_tok = 8
num_routed_experts = 384
num_moe_layers = 60

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
