# === Estate serving config: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 on 4x B200 (tp=4) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 — NemotronH hybrid: Mamba2 + attention +
# latent-MoE FFN layers. From HF config.json (model_type nemotron_h):
#   108 layers total: 48 mamba (M) + 12 attention (*) + 48 MoE-FFN (E);
#   hidden 8192; attention 64 heads x 128, 2 KV heads; mamba: 256 heads x 64
#   (d_inner 16384), ssm_state 128, 8 groups, conv 4, fp32 ssm cache;
#   MoE (latent): experts act on moe_latent_size 2048 with inter 5120,
#   relu^2 (non-gated, 2 matrices/expert), 512 routed + 1 shared (inter
#   10240), 22 per token; vocab 131072; 1 MTP layer (not modeled);
#   NVFP4 expert weights, bf16 elsewhere; max_pos 262144.
#
# qwen35 mapping:
#   - num_layers is set to 60 = attention + mamba layers ONLY. The 48
#     E-layers have no token mixing (no KV, no state) — their FFN params are
#     carried in the expert/non-expert buckets, which don't depend on
#     num_layers. num_moe_layers = 48 is bookkeeping (EP=1 here).
#   - 12 attention layers exact: H=64 x 128, kv_heads 2.
#   - 48 mamba layers as linear layers. Real state/layer = d_inner x
#     state x fp32 = 16384*128*4 B + conv 73728*4 B; the model
#     prices GDN state at bf16, so head counts are DOUBLED to keep bytes
#     right: value_heads=512 x dk 128 x dv 64 = 4_194_304 elems x 2 B
#     = 8_388_608 B (== fp32 truth), key_heads=16 makes the conv term
#     match (147456*2 B).
#
# Param split (computed; shared expert kept in the fp4 expert bucket —
# NVFP4 checkpoints quantize it too):
#   per routed expert (2 matrices, latent 2048 x inter 5120) = 20_971_520
#   shared expert total = 48*2*2048*10240 = 2_013_265_920
#   active expert  = 22*per*48 + shared = 24_159_191_040
#   resident expert= 512*per*48 + shared = 517_409_341_440
#   mamba layer (in_proj 8192x35072 + out 16384x8192) = 421_527_552
#   attn layer = 138_412_032; latent up/down proj = 1_610_612_736
#   router = 201_326_592; lm_head = 1_073_741_824
#   active non-exp = 24_779_948_032; resident non-exp = 25_853_689_856
#   Sanity: fp4+bf16 residency ~= 310_412_050_432 B vs
#   checkpoint 352_284_061_280 B (gap = NVFP4 scales + MTP).

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.88

[parallel]
tp = 4
ep = 1

[model]
type = "qwen35"
name = "NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
# Attention + mamba layers only; the MoE-FFN-only layers carry no KV/state
# (see header).
num_layers = 60
hidden_dim = 8192
max_seq_len = 262144

num_attention_layers = 12
num_attention_heads = 64
num_kv_heads = 2
attn_head_dim = 128

# Mamba2 layers as linear-state layers; heads doubled to price the fp32 ssm
# state at the model's bf16 rate (see header).
linear_num_value_heads = 512
linear_num_key_heads = 16
linear_key_head_dim = 128
linear_value_head_dim = 64
linear_conv_kernel = 4

num_active_expert_params = 24159191040
num_active_non_expert_params = 24779948032
num_resident_expert_params = 517409341440
num_resident_non_expert_params = 25853689856

num_experts_per_tok = 22
num_routed_experts = 512
num_moe_layers = 48

expert_precision = "fp4"
non_expert_precision = "bf16"
kv_precision = "bf16"

# Engine args from internal/inference/node catalogs (b200; backend sglang; backend defaults for mem_frac, chunked_prefill, max_running):
# mem-fraction/chunked-prefill/max-running -> 0.88/8192/4096
[scheduler]
max_num_batched_tokens = 8192
max_num_seqs = 4096
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
