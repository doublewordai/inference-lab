# === Estate serving config: allenai/olmOCR-2-7B-1025-FP8 on 1x B200 (tp=1) ===
# Hardware: B200 (dense datasheet: fp4 9.0e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 7.7e12 B/s, 180 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# allenai/olmOCR-2-7B-1025-FP8 — Qwen2.5-VL-7B fine-tune, dense GQA text
# stack. From HF allenai/olmOCR-2-7B-1025-FP8 config.json:
#   28 layers, hidden 3584, 28 heads x head_dim 128, 4 KV heads, full attention
#   (use_sliding_window=false), MLP inter 18944, vocab 152064, max_pos 128000.
#   FP8 weight quantization (alias); KV bf16. Vision tower (32-layer ViT,
#   ~0.67B params) is counted in residency only — per-image encode compute is
#   outside this cost model.
# Modeled by `qwen35` with zero experts and num_attention_layers = num_layers
# (degenerates to a plain GQA transformer with a separate KV precision).
#
# Param split (all non-expert; computed):
#   attn/layer (q 28x128 + k,v 4x128 + o) = 3584*8192 = 29_360_128
#   MLP/layer (gated, inter 18944) = 3*3584*18944 = 203_685_888
#   lm_head = 152064*3584 = 544_997_376
#   active = 28*(attn+mlp) + lm_head = 7_070_285_824
#   resident = 8_290_000_000 (Qwen2.5-VL-7B total incl. embedding + vision tower)

[hardware]
name = "B200"
flops_fp4 = 9.0e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 7.7e12
memory_capacity = 193273528320   # 180 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 1
ep = 1

[model]
type = "qwen35"
name = "olmOCR-2-7B-1025-FP8"
num_layers = 28
hidden_dim = 3584
max_seq_len = 128000

num_attention_layers = 28
num_attention_heads = 28
num_kv_heads = 4
attn_head_dim = 128

linear_num_value_heads = 0
linear_num_key_heads = 0
linear_key_head_dim = 0
linear_value_head_dim = 0
linear_conv_kernel = 0

num_active_expert_params = 0
num_active_non_expert_params = 7070285824
num_resident_expert_params = 0
num_resident_non_expert_params = 8290000000

num_experts_per_tok = 0
num_routed_experts = 0
num_moe_layers = 0

expert_precision = "fp8"
non_expert_precision = "fp8"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
