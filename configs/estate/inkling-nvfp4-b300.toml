# === Estate serving config: thinkingmachines/Inkling-NVFP4 on 8x B300 (tp=8) ===
# Hardware: B300 (dense datasheet: fp4 13.5e15 / fp8 4.5e15 / bf16 2.25e15 FLOP/s, 8.0e12 B/s, 288 GB).
# Scheduler: deadline-priority admission as the estate dispatches.
# The [workload] block is required by the config loader but unused by
# estate-lab (arrivals come from the replayed trace).
#
# thinkingmachines/Inkling-NVFP4 — MoE with 55 sliding(512) + 11 full
# attention layers and an 8-deep MTP chain. From HF
# thinkingmachines/Inkling-NVFP4 config.json (text_config):
#   66 layers (local_layer_ids: 55 sliding, window 512; 11 global full);
#   hidden 6144; full attn 64 heads x 128, 8 KV heads; sliding attn 64 heads
#   x 128, 16 KV heads; MoE: 256 routed + 2 shared, 6 per token, expert inter
#   3072 (gated), one dense MLP layer (idx 2, inter 24576); sconv kernel 4;
#   vocab 201024; max_len 1048576; mtp_config: 8 nextn layers (MoE-bearing —
#   included in expert residency, their compute is not modeled).
#
# qwen35 mapping:
#   - 11 full layers exact: H=64 x 128, kv 8.
#   - 55 sliding layers as fixed state: window 512 x (2*16*128 KV elems) =
#     2_097_152 elems = 4.19 MB/layer/seq bf16 -> value_heads=128 x 128 x 128
#     (+ conv 4, key_heads 1 ~ the small sconv state). Window attention flops
#     dropped (bounded by 512).
#   - coupon-collector over 256 routed, 6/tok (knee E/k ~ 43). Resident
#     experts include the 8 MTP layers' experts (73 layer-copies) so the
#     capacity number matches the checkpoint; this slightly inflates the
#     coupon per-expert weight (documented bias).
#
# Param split (computed; shared experts kept in fp4 expert bucket):
#   per expert = 3*6144*3072 = 56_623_104
#   active expert  = (6+2 shared) * per * 65 = 29_444_014_080
#   resident expert= (256+2) * per * (65+8 MTP) = 1_066_439_540_736
#   full attn layer = 113_246_208; swa layer = 125_829_120
#   dense MLP = 452_984_832; router = 102_236_160; lm_head = 1_235_091_456
#   active non-exp = 9_956_622_336; resident non-exp (+embed) = 11_191_713_792
#   Sanity: fp4+bf16 residency ~= 555_603_197_952 B vs
#   checkpoint 591_854_374_368 B (gap = NVFP4 scales).

[hardware]
name = "B300"
flops_fp4 = 13.5e15
flops_fp8 = 4.5e15
flops_bf16 = 2.25e15
flops_fp16 = 2.25e15
memory_bandwidth = 8.0e12
memory_capacity = 309237645312   # 288 GB
kv_cache_capacity = 0            # auto: mem * util - weights
gpu_memory_utilization = 0.9

[parallel]
tp = 8
ep = 1

[model]
type = "qwen35"
name = "Inkling-NVFP4"
num_layers = 66
hidden_dim = 6144
max_seq_len = 1048576

num_attention_layers = 11
num_attention_heads = 64
num_kv_heads = 8
attn_head_dim = 128

# Sliding(512) layers as fixed-size state (see header).
linear_num_value_heads = 128
linear_num_key_heads = 1
linear_key_head_dim = 128
linear_value_head_dim = 128
linear_conv_kernel = 4

num_active_expert_params = 29444014080
num_active_non_expert_params = 9956622336
num_resident_expert_params = 1066439540736
num_resident_non_expert_params = 11191713792

num_experts_per_tok = 6
num_routed_experts = 256
num_moe_layers = 65

expert_precision = "fp4"
non_expert_precision = "bf16"
kv_precision = "bf16"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 256
policy = "priority"
enable_chunked_prefill = true
block_size = 64

[workload]
arrival_pattern = "closed_loop"
num_concurrent_users = 1
num_requests = 1
seed = 1

[workload.input_len_dist]
type = "fixed"
value = 1024

[workload.output_len_dist]
type = "fixed"
value = 256
