# Qwen/Qwen3-VL-30B-A3B-Instruct-FP8
# MoE Vision-Language model: 128 experts, 8 active per token
# Total: ~30.5B params, Active: ~3.3B params per token, FP8 quantized

# Presets ship in the crate catalog (inference_lab::catalog); replace either with an
# inline [hardware] / [model] table to override.
hardware = "h100"
model = "qwen3-vl-30b-a3b-fp8"

[scheduler]
max_num_batched_tokens = 16384
max_num_seqs = 512
policy = "fcfs"
enable_chunked_prefill = true
block_size = 16

[workload]
arrival_pattern = "poisson"
arrival_rate = 10.0
num_requests = 1000
seed = 42

[workload.input_len_dist]
type = "lognormal"
mean = 7.6
std_dev = 0.8

[workload.output_len_dist]
type = "lognormal"
mean = 6.2
std_dev = 0.9
